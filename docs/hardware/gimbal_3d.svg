<text x="0" y="382" text-anchor="middle" fill="#cfd8dc" font-size="14">固定顺序：底座 → 水平舵机① → L型臂 → 垂直舵机② → 摄像头固定座 → 摄像头</text>
<text x="0" y="404" text-anchor="middle" fill="#9aa4b2" font-size="13">水平舵机控制左右转头，垂直舵机控制上下点头；加长排线让开发板不动、摄像头随云台转</text>
</svg>